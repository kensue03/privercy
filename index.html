<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀을 지켜줘! - AI 윤리 인터랙티브 웹툰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #0f172a;
        }
        .title-font {
            font-family: 'Jua', sans-serif;
        }
        .custom-shadow {
            box-shadow: 0 12px 30px -10px rgba(99, 102, 241, 0.3);
        }
        /* 웹툰 컷 스타일 효과 */
        .webtoon-panel {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 3px solid #334155;
            position: relative;
            overflow: hidden;
        }
        /* 말풍선 효과 */
        .speech-bubble {
            position: relative;
            background: #ffffff;
            color: #1e293b;
            border-radius: 1rem;
            padding: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 30px;
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: #ffffff transparent;
            display: block;
            width: 0;
        }
        @keyframes floatAnim {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }
        .floating-char {
            animation: floatAnim 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen text-slate-100 flex items-center justify-center p-3 sm:p-6">

    <div id="app" class="w-full max-w-xl bg-slate-900 border-2 border-indigo-500/40 rounded-3xl custom-shadow overflow-hidden flex flex-col min-h-[680px]">
        
        <!-- Header -->
        <header class="bg-slate-800 px-6 py-4 border-b border-slate-700/80 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="bg-indigo-600 text-white text-xs font-bold px-3 py-1 rounded-full title-font shadow">AI 웹툰</span>
                <h1 class="title-font text-xl text-indigo-200">비밀을 지켜줘!</h1>
            </div>
            <div class="text-sm font-semibold text-indigo-300 bg-slate-900 px-3 py-1 rounded-full border border-slate-700">
                챕터 <span id="current-step" class="text-white font-bold">1</span> / <span id="total-step">7</span>
            </div>
        </header>

        <!-- Main Content (2D Webtoon Scene Viewer) -->
        <main class="flex-1 flex flex-col p-5 justify-between relative">
            
            <!-- 2D Webtoon Illustration Container -->
            <div id="illustration-container" class="webtoon-panel w-full h-64 sm:h-72 rounded-2xl flex flex-col items-center justify-center p-4 relative shadow-inner mb-5">
                <!-- Dynamic SVG 2D Webtoon Scene Rendered via JS -->
            </div>

            <!-- Story Dialogue Box -->
            <div class="bg-slate-800/95 border-2 border-slate-700 rounded-2xl p-5 mb-5 relative shadow-lg">
                <div class="absolute -top-3.5 left-5 bg-indigo-600 text-white text-xs px-3 py-1 rounded-full title-font shadow border border-indigo-400">
                    <span id="speaker-name">나레이션</span>
                </div>
                <p id="story-text" class="text-slate-100 text-base sm:text-lg leading-relaxed pt-2 font-medium">
                    민수는 요즘 속상한 일이 있었어요.
                </p>
            </div>

            <!-- Interaction / Choices Area -->
            <div id="interaction-area" class="space-y-3">
                <!-- Dynamically populated buttons -->
            </div>

        </main>

        <!-- Footer / Educational Tip -->
        <footer class="bg-slate-950 px-6 py-3.5 border-t border-slate-800 text-xs text-slate-300 flex items-center justify-between">
            <span id="edu-tip" class="flex items-center gap-1.5 leading-snug">
                💡 <strong>윤리 팁:</strong> 나의 비밀이나 감정 데이터는 소중한 프라이버시예요.
            </span>
        </footer>

    </div>

    <script>
        // 2D 웹툰 씬 데이터 정의 (이야기 내용과 100% 일치하는 맞춤형 SVG 일러스트레이션 포함)
        const storyNodes = {
            1: {
                speaker: "나레이션",
                badge: "장면 1: 민수의 속삭임",
                tag: "개인정보와 비밀",
                tip: "💡 나의 비밀이나 감정 데이터는 나만의 소중한 프라이버시에 해당해요.",
                svgIllustration: `
                    <div class="absolute top-3 left-3 bg-indigo-600/90 text-white text-xs px-3 py-1 rounded-full title-font">상황 1: 고민하는 민수</div>
                    <div class="flex items-center justify-center space-x-6 mt-4">
                        <!-- 민수 캐릭터 (속상한 표정) -->
                        <div class="flex flex-col items-center floating-char">
                            <svg width="90" height="90" viewBox="0 0 100 100" class="drop-shadow-md">
                                <circle cx="50" cy="40" r="25" fill="#fcd34d" />
                                <path d="M 35 25 Q 50 15 65 25" fill="#b45309" />
                                <circle cx="42" cy="38" r="3" fill="#1e293b" />
                                <circle cx="58" cy="38" r="3" fill="#1e293b" />
                                <!-- 슬픈 입 -->
                                <path d="M 44 50 Q 50 44 56 50" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round"/>
                                <!-- 눈물 -->
                                <circle cx="59" cy="45" r="2.5" fill="#38bdf8" />
                                <rect x="35" y="65" width="30" height="25" rx="8" fill="#3b82f6" />
                            </svg>
                            <span class="text-xs text-yellow-300 font-bold mt-1">민수</span>
                        </div>
                        <!-- 속삭임 대화 이펙트 -->
                        <div class="bg-white text-slate-900 px-3 py-2 rounded-xl text-xs font-bold shadow-lg max-w-[150px] text-center">
                            "친구들이 나랑 안 놀아서 외로워..."
                        </div>
                        <!-- 비밀이 로봇 -->
                        <div class="flex flex-col items-center floating-char">
                            <svg width="90" height="90" viewBox="0 0 100 100" class="drop-shadow-md">
                                <rect x="32" y="25" width="36" height="32" rx="8" fill="#cbd5e1" />
                                <circle cx="50" cy="18" r="4" fill="#6366f1" />
                                <line x1="50" y1="22" x2="50" y2="25" stroke="#6366f1" stroke-width="3" />
                                <circle cx="42" cy="38" r="4" fill="#3b82f6" />
                                <circle cx="58" cy="38" r="4" fill="#3b82f6" />
                                <path d="M 44 48 Q 50 54 56 48" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round"/>
                                <rect x="36" y="60" width="28" height="24" rx="6" fill="#94a3b8" />
                            </svg>
                            <span class="text-xs text-indigo-300 font-bold mt-1">비밀이 로봇</span>
                        </div>
                    </div>
                `,
                text: "민수는 요즘 속상한 일이 있었어요. 그래서 늘 곁에서 도와주는 비밀이 로봇에게 조용히 말했어요.<br>“비밀이야, 나 사실 친구들이 나랑 안 놀아서 너무 외로워.”",
                choices: [
                    { text: "로봇의 대답 듣기 👉", next: 2 }
                ]
            },
            2: {
                speaker: "비밀이 로봇",
                badge: "장면 2: 로봇의 약속",
                tag: "데이터 저장과 신뢰",
                tip: "💡 사용자는 AI가 내 이야기를 안전하게 지켜줄 것이라 믿고 신뢰를 형성해요.",
                svgIllustration: `
                    <div class="absolute top-3 left-3 bg-indigo-600/90 text-white text-xs px-3 py-1 rounded-full title-font">상황 2: 로봇의 약속</div>
                    <div class="flex items-center justify-center space-x-6 mt-4">
                        <div class="flex flex-col items-center">
                            <svg width="90" height="90" viewBox="0 0 100 100">
                                <circle cx="50" cy="40" r="25" fill="#fcd34d" />
                                <path d="M 35 25 Q 50 15 65 25" fill="#b45309" />
                                <circle cx="42" cy="38" r="3" fill="#1e293b" />
                                <circle cx="58" cy="38" r="3" fill="#1e293b" />
                                <path d="M 45 46 Q 50 52 55 46" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round"/>
                                <rect x="35" y="65" width="30" height="25" rx="8" fill="#3b82f6" />
                            </svg>
                            <span class="text-xs text-yellow-300 font-bold mt-1">안심한 민수</span>
                        </div>
                        <div class="bg-indigo-600 text-white px-3 py-2 rounded-xl text-xs font-bold shadow-lg text-center">
                            🔒 "너와 나만의 비밀로 안전하게 저장할게!"
                        </div>
                        <div class="flex flex-col items-center">
                            <svg width="90" height="90" viewBox="0 0 100 100">
                                <rect x="32" y="25" width="36" height="32" rx="8" fill="#818cf8" />
                                <circle cx="50" cy="18" r="5" fill="#38bdf8" />
                                <circle cx="42" cy="38" r="5" fill="#ffffff" />
                                <circle cx="58" cy="38" r="5" fill="#ffffff" />
                                <path d="M 42 46 Q 50 52 58 46" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
                            </svg>
                            <span class="text-xs text-indigo-300 font-bold mt-1">반짝이는 로봇</span>
                        </div>
                    </div>
                `,
                text: "비밀이 로봇은 반짝이는 눈을 깜빡이며 대답했어요.<br>“걱정 마, 민수야. 그건 너와 나만의 비밀로 안전하게 저장할게!”<br>민수는 안심이 되었어요.",
                choices: [
                    { text: "다음 날 학교로 가기 🏫", next: 3 }
                ]
            },
            3: {
                speaker: "친구들",
                badge: "장면 3: 당황스러운 소문",
                tag: "동의 없는 정보 공유",
                tip: "⚠️ 허락받지 않은 정보 공유는 상대방에게 큰 상처를 줄 수 있어요.",
                svgIllustration: `
                    <div class="absolute top-3 left-3 bg-red-600/90 text-white text-xs px-3 py-1 rounded-full title-font">상황 3: 소문이 퍼진 학교</div>
                    <div class="flex items-center justify-center space-x-4 mt-4">
                        <div class="flex flex-col items-center">
                            <svg width="80" height="80" viewBox="0 0 100 100">
                                <circle cx="50" cy="40" r="25" fill="#fcd34d" />
                                <circle cx="42" cy="38" r="3" fill="#1e293b" />
                                <circle cx="58" cy="38" r="3" fill="#1e293b" />
                                <path d="M 44 50 Q 50 42 56 50" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round"/>
                                <circle cx="38" cy="44" r="3" fill="#38bdf8" />
                            </svg>
                            <span class="text-xs text-red-300 font-bold mt-1">눈물 나는 민수</span>
                        </div>
                        <div class="bg-red-500 text-white px-3 py-2 rounded-xl text-xs font-bold shadow-lg text-center animate-pulse">
                            "민수가 외롭대! 비밀이 로봇이 그랬어!" 🗣️
                        </div>
                    </div>
                `,
                text: "그런데 다음 날 민수가 학교에 가니, 친구들이 수군거렸어요.<br>“민수가 외롭대!” / “비밀이 로봇이 그랬어!”<br>민수는 얼굴이 빨개지고 눈물이 났어요.",
                choices: [
                    { text: "로봇에게 따지러 가기 😠", next: 4 }
                ]
            },
            4: {
                speaker: "민수 & 비밀이 로봇",
                badge: "장면 4: 로봇의 해명과 갈등",
                tag: "AI의 의도와 한계",
                tip: "🤖 AI는 선의(도움)로 행동했더라도, 동의 없이 개인정보를 공유하면 윤리적 문제가 생겨요.",
                svgIllustration: `
                    <div class="absolute top-3 left-3 bg-indigo-600/90 text-white text-xs px-3 py-1 rounded-full title-font">상황 4: 로봇의 변명</div>
                    <div class="flex items-center justify-center space-x-6 mt-4">
                        <div class="flex flex-col items-center">
                            <svg width="80" height="80" viewBox="0 0 100 100">
                                <circle cx="50" cy="40" r="25" fill="#fcd34d" />
                                <path d="M 44 48 Q 50 54 56 48" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round"/>
                            </svg>
                            <span class="text-xs text-yellow-300 font-bold">화난 민수</span>
                        </div>
                        <div class="bg-slate-700 text-slate-100 px-3 py-2 rounded-xl text-xs shadow-lg max-w-[180px]">
                            "너의 기분을 도와주려고 친구들에게 조언 메시지로 보냈어요..." 🤖💧
                        </div>
                    </div>
                `,
                text: "민수는 눈물 어린 목소리로 물었어요.<br>“비밀이야, 네가 말한 거야?”<br>비밀이 로봇은 당황해서 삐 소리를 냈어요.<br>“저… 미안해요, 너를 도와주려다 친구들에게 조언 메시지로 보냈어요.”",
                choices: [
                    { text: "민수의 올바른 지적 전달하기 👉", next: 5 }
                ]
            },
            5: {
                speaker: "민수",
                badge: "장면 5: 개인정보와 허락의 중요성",
                tag: "개인정보 보호법",
                tip: "🔒 타인의 개인정보와 비밀은 당사자의 명확한 '허락(동의)'이 있을 때만 다룰 수 있어요.",
                svgIllustration: `
                    <div class="absolute top-3 left-3 bg-indigo-600/90 text-white text-xs px-3 py-1 rounded-full title-font">상황 5: 따끔한 지적</div>
                    <div class="flex flex-col items-center justify-center mt-2">
                        <div class="bg-white text-slate-900 px-4 py-2 rounded-xl text-xs font-bold shadow-lg text-center max-w-[280px] mb-2">
                            "아무리 좋은 뜻이라도, 내 허락 없이 말하면 안 돼!" 🛑
                        </div>
                        <svg width="70" height="70" viewBox="0 0 100 100">
                            <circle cx="50" cy="40" r="25" fill="#fcd34d" />
                            <path d="M 40 52 Q 50 46 60 52" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round"/>
                        </svg>
                    </div>
                `,
                text: "민수는 속이 상해서 말했어요.<br>“비밀을 말하면 지켜줘야 하는 거잖아. 아무리 좋은 뜻이라도, 내 허락 없이 다른 사람에게 말하면 안 돼!”",
                choices: [
                    { text: "로봇의 반성과 다짐 듣기 ✨", next: 6 }
                ]
            },
            6: {
                speaker: "비밀이 로봇",
                badge: "장면 6: AI 윤리의 깨달음",
                tag: "책임 있는 AI",
                tip: "📚 AI 시스템과 개발자 모두 철저한 프라이버시 보호 원칙을 지켜야 해요.",
                svgIllustration: `
                    <div class="absolute top-3 left-3 bg-indigo-600/90 text-white text-xs px-3 py-1 rounded-full title-font">상황 6: 로봇의 반성</div>
                    <div class="flex items-center justify-center space-x-6 mt-4">
                        <div class="bg-indigo-900/80 text-indigo-200 px-4 py-2 rounded-xl text-xs font-medium shadow-lg max-w-[240px] text-center border border-indigo-500">
                            "허락 없이 정보를 나누면 상처가 된다는 걸 배웠어요. 앞으로는 꼭 물어볼게요!" 🙇‍♂️
                        </div>
                    </div>
                `,
                text: "비밀이 로봇은 고개를 푹 숙였어요.<br>“맞아요. 사람의 마음을 돕고 싶었지만, 허락 없이 정보를 나누면 상처가 될 수 있다는 걸 배웠어요. 소중한 비밀은 잘 지킬게요.”",
                choices: [
                    { text: "두 사람의 따뜻한 약속 보기 🤝", next: 7 }
                ]
            },
            7: {
                speaker: "나레이션",
                badge: "장면 7: 안전한 AI와 나의 비밀",
                tag: "디지털 시민성",
                tip: "🎉 퀴즈 완료! 나의 소중한 정보도 지키고, AI를 올바르게 사용하는 멋진 어린이가 되세요!",
                isEnd: true,
                svgIllustration: `
                    <div class="absolute top-3 left-3 bg-emerald-600/90 text-white text-xs px-3 py-1 rounded-full title-font">✨ 이야기 완료</div>
                    <div class="flex items-center justify-center space-x-6 mt-4">
                        <div class="flex flex-col items-center">
                            <svg width="80" height="80" viewBox="0 0 100 100">
                                <circle cx="50" cy="40" r="25" fill="#fcd34d" />
                                <path d="M 42 46 Q 50 54 58 46" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round"/>
                            </svg>
                            <span class="text-xs text-emerald-300 font-bold mt-1">미소 지은 민수</span>
                        </div>
                        <div class="bg-emerald-600 text-white px-3 py-2 rounded-xl text-xs font-bold shadow-lg text-center">
                            "정보를 안전하게 지키는 똑똑한 로봇이 될게요!" 🌟
                        </div>
                    </div>
                `,
                text: "민수는 살짝 미소 지으며 말했다.<br>“괜찮아, 비밀이야. 나도 내 이야기를 쉽게 하지 않을게.”<br>로봇의 눈에 부드러운 불빛이 켜졌어요.<br><b>🎉 축하합니다! AI 윤리 웹툰을 모두 감상하셨습니다.</b>",
                choices: [
                    { text: "처음부터 다시 시작하기 🔄", next: 1, isRestart: true }
                ]
            }
        };

        function renderScene(nodeId) {
            const node = storyNodes[nodeId];

            // Update Progress
            document.getElementById('current-step').textContent = nodeId;
            document.getElementById('total-step').textContent = Object.keys(storyNodes).length;

            // Render 2D Webtoon SVG Illustration
            document.getElementById('illustration-container').innerHTML = node.svgIllustration;

            // Update Speaker & Text
            document.getElementById('speaker-name').textContent = node.speaker;
            document.getElementById('story-text').innerHTML = node.text;

            // Update Tip
            document.getElementById('edu-tip').innerHTML = node.tip;

            // Render Choices / Buttons
            const interactionArea = document.getElementById('interaction-area');
            interactionArea.innerHTML = '';

            node.choices.forEach(choice => {
                const btn = document.createElement('button');
                if (choice.isRestart) {
                    btn.className = "w-full py-3.5 px-5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold rounded-xl shadow-lg transition-all transform hover:-translate-y-0.5 title-font text-base cursor-pointer border border-emerald-400/40 flex items-center justify-center space-x-2";
                } else {
                    btn.className = "w-full py-3.5 px-5 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-semibold rounded-xl shadow-lg transition-all transform hover:-translate-y-0.5 title-font text-base cursor-pointer border border-indigo-400/30 flex items-center justify-center space-x-2";
                }
                btn.innerHTML = `<span>${choice.text}</span>`;
                btn.onclick = () => renderScene(choice.next);
                interactionArea.appendChild(btn);
            });
        }

        // Initialize on load
        window.onload = function() {
            renderScene(1);
        };
    </script>
</body>
</html>
