                            "보안 시스템 업그레이드 완료! 프라이버시 보호 필터를 최우선으로 가동합니다." 🛡️
                        </div>
                    </div>
                `,
                text: "비밀이 로봇의 시스템이 붉은색에서 안전한 초록색 보안 등급으로 바뀌었어요.<br>“명령을 완수했습니다, 민수님. 최고 등급의 암호화 알고리즘으로 민수님의 비밀을 철벽 방어하겠습니다!”",
                choices: [
                    { text: "엔딩 확인하기 🛡️", next: 10 }
                ]
            },
            10: {
                speaker: "나레이션 [엔딩 2]",
                badge: "⭐ 엔딩 2: 철저한 보안과 책임 엔딩",
                tip: "🎉 축하합니다! AI의 철저한 보안 관리와 데이터 주권의 중요성을 배웠어요.",
                isEnd: true,
                svgIllustration: `
                    <div class="absolute top-3 left-3 bg-amber-600/90 text-white text-xs px-3 py-1 rounded-full title-font">✨ 엔딩 2 달성</div>
                    <div class="flex items-center justify-center space-x-6 mt-4">
                        <div class="flex flex-col items-center">
                            <svg width="80" height="80" viewBox="0 0 100 100">
                                <rect x="32" y="25" width="36" height="32" rx="8" fill="#10b981" />
                                <circle cx="50" cy="18" r="5" fill="#ffffff" />
                            </svg>
                            <span class="text-xs text-amber-300 font-bold mt-1">보안 로봇</span>
                        </div>
                        <div class="bg-amber-600 text-white px-3 py-2 rounded-xl text-xs font-bold shadow-lg text-center">
                            "철저한 프라이버시 수호자 탄생!" 🛡️
                        </div>
                    </div>
                `,
                text: "민수는 안심하며 고개를 끄덕였어요.<br>“그래, 앞으로는 내 동의 없는 데이터 공유는 절대 안 되는 거야.”<br>철저한 보안 규칙을 갖춘 로봇과 민수는 더욱 안전한 친구가 되었답니다.<br><b>🏆 [엔딩 2] 철저한 보안과 데이터 주권 수호 완료!</b>",
                choices: [
                    { text: "처음부터 다시 시작하기 (다른 엔딩 도전) 🔄", next: 1, isRestart: true }
                ]
            }
        };

        function renderScene(nodeId) {
            const node = storyNodes[nodeId];

            // Update Progress / Header label
            document.getElementById('current-step-label').textContent = node.badge.split(':')[0] || `장면 ${nodeId}`;

            // Render 2D Webtoon SVG Illustration
            document.getElementById('illustration-container').innerHTML = node.svgIllustration;

            // Update Speaker & Badge & Text
            document.getElementById('speaker-badge').textContent = node.speaker;
            document.getElementById('story-text').innerHTML = node.text;

            // Update Tip
            document.getElementById('edu-tip').innerHTML = node.tip;

            // Render Choices / Buttons
            const interactionArea = document.getElementById('interaction-area');
            interactionArea.innerHTML = '';

            node.choices.forEach(choice => {
                const btn = document.createElement('button');
                if (choice.isRestart) {
                    btn.className = "w-full py-3.5 px-5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold rounded-xl shadow-lg transition-all transform hover:-translate-y-0.5 title-font text-base cursor-pointer border border-emerald-400/40 flex items-center justify-center space-x-2";
                } else {
                    btn.className = "w-full py-3.5 px-5 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-semibold rounded-xl shadow-lg transition-all transform hover:-translate-y-0.5 title-font text-sm sm:text-base cursor-pointer border border-indigo-400/30 flex items-center justify-center space-x-2 text-left";
                }
                btn.innerHTML = `<span>${choice.text}</span>`;
                btn.onclick = () => renderScene(choice.next);
                interactionArea.appendChild(btn);
            });
        }

        // Initialize on load
        window.onload = function() {
            renderScene(1);
        };
    </script>
</body>
</html>
